name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest --screenshot only-on-failure --output test-results
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          CLIENT_USEREMAIL: ${{ secrets.CLIENT_USEREMAIL }}
          CLIENT_USERPASSWORD: ${{ secrets.CLIENT_USERPASSWORD }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore